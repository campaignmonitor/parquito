plugins {
  id 'parquito.linting'
}

dependencies {
  testImplementation project(':core')
  testImplementation project(':json')
  testImplementation project(':protobuf')
  testImplementation project(':schemas')

  testImplementation "com.google.guava:guava:${guava_version}"

  // Pull in the Apache Parquet libraries for compatibility testing
  testImplementation("org.apache.parquet:parquet-hadoop:${parquet_version}") {
    exclude group: 'org.apache.hadoop'
  }
  testImplementation("org.apache.parquet:parquet-protobuf:${parquet_version}") {
    exclude group: 'org.apache.hadoop'
  }
  testImplementation("org.apache.parquet:parquet-avro:${parquet_version}") {
    exclude group: 'org.apache.hadoop'
  }
  testImplementation("org.apache.hadoop:hadoop-common:${hadoop_version}") {
    transitive = false
  }
  testImplementation("org.apache.hadoop:hadoop-mapreduce-client-core:${hadoop_version}") {
    transitive = false
  }
  testImplementation "com.fasterxml.woodstox:woodstox-core:${woodstox_version}"
  testImplementation 'commons-collections:commons-collections:3.2.2'
  testImplementation "org.apache.commons:commons-collections4:${commons_collections4_version}"
  testImplementation "org.apache.hadoop.thirdparty:hadoop-shaded-guava:${hadoop_thirdparty_version}"
  testImplementation 'log4j:log4j:1.2.17'
}

test {
  jvmArgs += [
    // Needed for the bloom filter hashing library to hash direct buffers
    "--add-exports=java.base/sun.nio.ch=ALL-UNNAMED"
  ]
}
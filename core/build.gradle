plugins {
  id 'parquito.published-library'
  id 'parquito.linting'
}

dependencies {
  api "org.apache.parquet:parquet-format-structures:${parquet_version}"
  api "org.xerial.snappy:snappy-java:${snappy_java_version}"
  api 'net.openhft:zero-allocation-hashing:2026.0'
  api "it.unimi.dsi:fastutil:${fastutil_version}"

  testImplementation "com.google.guava:guava:${guava_version}"
}
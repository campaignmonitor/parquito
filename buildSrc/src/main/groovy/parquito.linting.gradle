plugins {
  id 'parquito.common'
  id 'com.github.spotbugs'
  id 'com.diffplug.spotless'
}

spotless {
  java {
    googleJavaFormat(google_java_format_version)
  }
  groovyGradle {
    target('*.gradle')
    greclipse()
    trimTrailingWhitespace()
    leadingTabsToSpaces(2)
  }
  format "shellScripts", {
    target('*.sh')
    trimTrailingWhitespace()
    leadingTabsToSpaces(2)
  }
}

dependencies {
  compileOnly "com.github.spotbugs:spotbugs-annotations:${spotbugs_annotations_version}"
}

spotbugs {
  excludeFilter = project.parent.file("spotbugs.excludes.xml")
}
plugins {
  id 'parquito.common'
  id 'com.google.protobuf'
  id 'idea'
  id 'java-library'
}

repositories {
  mavenCentral()
}

dependencies {
  api "com.google.protobuf:protobuf-java:${protobuf_version}"

// Java 9+ requires this to be here for GRPC to compile properly
// https://github.com/grpc/grpc-java/issues/3633
  implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

sourceSets {
  main {
    proto {
      include 'google/**/*.proto'
    }
  }
}

protobuf {
  protoc {
    artifact = "com.google.protobuf:protoc:${protobuf_version}"
  }
}

idea {
  module {
    // proto files and generated Java files are automatically added as
    // source dirs.
    // If you have additional sources, add them here:
//    sourceDirs += file("$projectDir/something/else/");
  }
}
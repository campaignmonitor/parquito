plugins {
  id 'groovy-gradle-plugin'
}

repositories {
  gradlePluginPortal() // so that external plugins can be resolved in dependencies section
}

dependencies {
  implementation "com.google.protobuf:protobuf-gradle-plugin:${protobuf_gradle_plugin_version}"
  implementation "com.github.spotbugs.snom:spotbugs-gradle-plugin:${spotbugs_gradle_plugin_version}"
  implementation "com.diffplug.spotless:spotless-plugin-gradle:${spotless_plugin_gradle_version}"
}